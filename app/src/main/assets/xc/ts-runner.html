<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>xc ts</title></head><body>
<script src="typescript.js"></script>
<script>
// Offline TypeScript -> JavaScript. Syntax-level only (transpileModule): it does NOT type-check.
window.xcTranspile = function (src, fileName) {
  try {
    var out = ts.transpileModule(src, {
      fileName: fileName,
      reportDiagnostics: true,
      compilerOptions: {
        target: ts.ScriptTarget.ES2020,
        module: ts.ModuleKind.ESNext,
        jsx: ts.JsxEmit.React,
        isolatedModules: true
      }
    });
    var diags = (out.diagnostics || []).map(function (d) {
      var line = 0, col = 0;
      if (d.file && d.start != null) {
        var p = d.file.getLineAndCharacterOfPosition(d.start);
        line = p.line + 1; col = p.character + 1;
      }
      return { line: line, col: col, message: ts.flattenDiagnosticMessageText(d.messageText, "\n") };
    });
    return JSON.stringify({ ok: true, js: out.outputText, diagnostics: diags, version: ts.version });
  } catch (e) {
    return JSON.stringify({ ok: false, error: String(e) });
  }
};
window.xcReady = typeof ts !== "undefined";
</script></body></html>
