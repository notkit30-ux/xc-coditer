name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # image includes the Android SDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E -A3 '^(e: |\* What went wrong|.*FAILED)' build.log | grep -v -E '^(> Task|--)' | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xc-coditer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  # Proves the release-signing pipeline end to end with a throwaway key created here (never reused, never uploaded).
  signing-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Create throwaway keystore
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass throwaway1 -keypass throwaway1 \
            -alias tmp -keyalg RSA -keysize 2048 -validity 2 -dname "CN=throwaway"
      - name: Build signed release APK
        env:
          XC_KEYSTORE_PATH: ${{ runner.temp }}/throwaway.jks
          XC_KEYSTORE_PASSWORD: throwaway1
          XC_KEY_ALIAS: tmp
          XC_KEY_PASSWORD: throwaway1
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E -A3 '^(e: |\* What went wrong|.*FAILED)' build.log | grep -v -E '^(> Task|--)' | head -30 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
